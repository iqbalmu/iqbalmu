<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 148" width="1000" height="148" role="img" aria-label="Iqbal Muhakim, Full-Stack Developer">
  <defs>
    <style>
      :root {
        --bg: #0d1117;
        --fg: #f0f6fc;
        --muted: #9198a1;
        --rule: #30363d;
        --rule-strong: #f0f6fc;
        --surface: #161b22;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --fg: #1f2328;
          --muted: #59636e;
          --rule: #d0d7de;
          --rule-strong: #1f2328;
          --surface: #f6f8fa;
        }
      }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 40px;
        font-weight: 800;
        letter-spacing: -1px;
        fill: var(--fg);
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 15px;
        font-weight: 500;
        fill: var(--muted);
      }
      .meta {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 11.5px;
        font-weight: 600;
        fill: var(--muted);
      }
      .meta-strong {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 11.5px;
        font-weight: 700;
        fill: var(--fg);
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="148" rx="4" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.5"/>

  <!-- Top Editorial Rule -->
  <line x1="28" y1="22" x2="972" y2="22" stroke="var(--rule-strong)" stroke-width="2"/>
  <line x1="28" y1="26" x2="972" y2="26" stroke="var(--rule)" stroke-width="1"/>

  <!-- Left: Name & Role -->
  <rect x="28" y="48" width="8" height="36" fill="var(--rule-strong)"/>
  <text x="48" y="79" class="title">Iqbal Muhakim</text>
  <text x="48" y="106" class="subtitle">Full-stack developer building web applications, backend services, and developer tools.</text>

  <!-- Right: Editorial Index Metadata -->
  <line x1="680" y1="42" x2="680" y2="112" stroke="var(--rule)" stroke-width="1"/>

  <text x="700" y="58" class="meta">ROLE</text>
  <text x="780" y="58" class="meta-strong">Software Developer</text>

  <text x="700" y="81" class="meta">FOCUS</text>
  <text x="780" y="81" class="meta-strong">System Design &amp; Architecture</text>

  <text x="700" y="104" class="meta">CONTACT</text>
  <text x="780" y="104" class="meta-strong">iqbalmu160@gmail.com</text>

  <!-- Bottom Editorial Rule -->
  <line x1="28" y1="126" x2="972" y2="126" stroke="var(--rule)" stroke-width="1"/>
</svg>
