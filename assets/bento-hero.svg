<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" role="img" aria-label="Iqbal Muhakim - Full-Stack Developer">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#090c10"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .pulse-dot { animation: pulse 2.4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Outer Bento Frame -->
  <rect x="1" y="1" width="998" height="218" rx="12" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="2" y="2" width="996" height="216" rx="11" fill="url(#grid)" opacity="0.65"/>

  <!-- Left Content Area -->
  <!-- Status Pills -->
  <rect x="32" y="28" width="156" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="44" y="44" fill="#c9d1d9" class="mono" font-size="11" font-weight="600" letter-spacing="0.8">SYS // IQBAL.MU</text>

  <rect x="198" y="28" width="234" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="212" cy="40" r="3.5" fill="#ffffff" class="pulse-dot"/>
  <text x="224" y="44" fill="#8b949e" class="mono" font-size="11" font-weight="500" letter-spacing="0.5">OPEN TO COLLABORATION</text>

  <!-- Main Title -->
  <text x="32" y="96" fill="#ffffff" class="sans" font-size="34" font-weight="700" letter-spacing="-0.5">Iqbal Muhakim</text>
  <text x="292" y="95" fill="#6e7681" class="mono" font-size="20" font-weight="500">&lt;/&gt;</text>

  <!-- Role Subtitle -->
  <text x="32" y="124" fill="#c9d1d9" class="mono" font-size="13" font-weight="600" letter-spacing="0.4">FULL-STACK DEVELOPER  ·  SYSTEM DESIGN  ·  SOFTWARE ARCHITECTURE</text>

  <!-- Divider -->
  <line x1="32" y1="140" x2="544" y2="140" stroke="#21262d" stroke-width="1"/>

  <!-- Concise Description (General & Project-Agnostic) -->
  <text x="32" y="166" fill="#8b949e" class="sans" font-size="13.5">Designing and building end-to-end software — from intuitive user interfaces</text>
  <text x="32" y="188" fill="#8b949e" class="sans" font-size="13.5">to resilient backend services and maintainable system architectures.</text>

  <!-- Right Bento Sub-Panel: Quick Profile Spec -->
  <rect x="572" y="20" width="406" height="180" rx="8" fill="#080b0f" stroke="#21262d" stroke-width="1.2"/>

  <!-- Sub-Panel Top Bar -->
  <rect x="572" y="20" width="406" height="28" rx="8" fill="#12161c"/>
  <line x1="572" y1="48" x2="978" y2="48" stroke="#21262d" stroke-width="1"/>
  <circle cx="588" cy="34" r="3" fill="#484f58"/>
  <circle cx="599" cy="34" r="3" fill="#484f58"/>
  <circle cx="610" cy="34" r="3" fill="#484f58"/>
  <text x="626" y="38" fill="#8b949e" class="mono" font-size="10.5" font-weight="600" letter-spacing="0.8">SNAPSHOT // PROFILE SPEC</text>
  <text x="962" y="38" text-anchor="end" fill="#6e7681" class="mono" font-size="10">[READY]</text>

  <!-- Spec Row 1 -->
  <rect x="588" y="58" width="374" height="28" rx="5" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="600" y="76" fill="#ffffff" class="mono" font-size="10.5" font-weight="700">ROLE</text>
  <text x="684" y="76" fill="#c9d1d9" class="sans" font-size="12">Full-Stack Software Developer</text>

  <!-- Spec Row 2 -->
  <rect x="588" y="92" width="374" height="28" rx="5" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="600" y="110" fill="#ffffff" class="mono" font-size="10.5" font-weight="700">SCOPE</text>
  <text x="684" y="110" fill="#c9d1d9" class="sans" font-size="12">Web Apps, Mobile &amp; Backend Services</text>

  <!-- Spec Row 3 -->
  <rect x="588" y="126" width="374" height="28" rx="5" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="600" y="144" fill="#ffffff" class="mono" font-size="10.5" font-weight="700">FOCUS</text>
  <text x="684" y="144" fill="#c9d1d9" class="sans" font-size="12">System Design &amp; Scalable Architecture</text>

  <!-- Spec Row 4 -->
  <rect x="588" y="160" width="374" height="28" rx="5" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="600" y="178" fill="#ffffff" class="mono" font-size="10.5" font-weight="700">CONTACT</text>
  <text x="684" y="178" fill="#c9d1d9" class="mono" font-size="11.5">iqbalmu160@gmail.com</text>
