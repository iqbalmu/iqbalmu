<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" role="img" aria-label="Iqbal Muhakim - Full-Stack Developer">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#21262d"/>
    </pattern>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#090c10"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes flow {
        0% { stroke-dashoffset: 24; }
        100% { stroke-dashoffset: 0; }
      }
      .pulse-dot { animation: pulse 2.4s ease-in-out infinite; }
      .flow-line { stroke-dasharray: 4 4; animation: flow 1.6s linear infinite; }
    </style>
  </defs>

  <!-- Outer Bento Frame -->
  <rect x="1" y="1" width="998" height="218" rx="12" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="2" y="2" width="996" height="216" rx="11" fill="url(#grid)" opacity="0.65"/>

  <!-- Left Content Area -->
  <!-- Status Pill -->
  <rect x="32" y="28" width="156" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="44" y="44" fill="#c9d1d9" class="mono" font-size="11" font-weight="600" letter-spacing="0.8">SYS // IQBAL.MU</text>

  <rect x="198" y="28" width="234" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="212" cy="40" r="3.5" fill="#ffffff" class="pulse-dot"/>
  <text x="224" y="44" fill="#8b949e" class="mono" font-size="11" font-weight="500" letter-spacing="0.5">OPEN TO COLLABORATION</text>

  <!-- Main Title -->
  <text x="32" y="96" fill="#ffffff" class="sans" font-size="34" font-weight="700" letter-spacing="-0.5">Iqbal Muhakim</text>
  <text x="292" y="95" fill="#6e7681" class="mono" font-size="20" font-weight="500">&lt;/&gt;</text>

  <!-- Role Subtitle -->
  <text x="32" y="124" fill="#c9d1d9" class="mono" font-size="13" font-weight="600" letter-spacing="0.4">FULL-STACK DEVELOPER  ·  SYSTEM DESIGN  ·  DEVELOPER TOOLING</text>

  <!-- Divider -->
  <line x1="32" y1="140" x2="548" y2="140" stroke="#21262d" stroke-width="1"/>

  <!-- Concise Description -->
  <text x="32" y="166" fill="#8b949e" class="sans" font-size="13.5">Building reliable web applications and backend services for real-world scale,</text>
  <text x="32" y="188" fill="#8b949e" class="sans" font-size="13.5">while crafting CLI utilities and lightweight relays under the hood.</text>

  <!-- Right Bento Sub-Panel: Architecture Topology Schematic -->
  <rect x="576" y="20" width="402" height="180" rx="8" fill="#080b0f" stroke="#21262d" stroke-width="1.2"/>
  <rect x="577" y="21" width="400" height="178" rx="7" fill="url(#dots)" opacity="0.8"/>

  <!-- Sub-Panel Top Bar -->
  <rect x="576" y="20" width="402" height="28" rx="8" fill="#12161c"/>
  <line x1="576" y1="48" x2="978" y2="48" stroke="#21262d" stroke-width="1"/>
  <circle cx="592" cy="34" r="3" fill="#484f58"/>
  <circle cx="603" cy="34" r="3" fill="#484f58"/>
  <circle cx="614" cy="34" r="3" fill="#484f58"/>
  <text x="630" y="38" fill="#8b949e" class="mono" font-size="10.5" font-weight="600" letter-spacing="0.8">ARCHITECTURE // TOPOLOGY</text>
  <text x="928" y="38" fill="#6e7681" class="mono" font-size="10">[ACTIVE]</text>

  <!-- Connecting Lines -->
  <path d="M 688 84 L 732 104" fill="none" stroke="#484f58" stroke-width="1.5" class="flow-line"/>
  <path d="M 688 140 L 732 120" fill="none" stroke="#484f58" stroke-width="1.5" class="flow-line"/>
  <path d="M 838 104 L 874 84" fill="none" stroke="#484f58" stroke-width="1.5" class="flow-line"/>
  <path d="M 838 120 L 874 140" fill="none" stroke="#484f58" stroke-width="1.5" class="flow-line"/>

  <!-- Node 1: Web & UI -->
  <rect x="594" y="64" width="94" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="641" y="81" text-anchor="middle" fill="#ffffff" class="mono" font-size="10.5" font-weight="600">WEB / UI</text>
  <text x="641" y="94" text-anchor="middle" fill="#8b949e" class="mono" font-size="8.5">Interfaces</text>

  <!-- Node 2: CLI Tooling -->
  <rect x="594" y="122" width="94" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="641" y="139" text-anchor="middle" fill="#ffffff" class="mono" font-size="10.5" font-weight="600">CLI / TOOLS</text>
  <text x="641" y="152" text-anchor="middle" fill="#8b949e" class="mono" font-size="8.5">Automation</text>

  <!-- Center Hub Node: Core Services & Relay -->
  <rect x="732" y="86" width="106" height="52" rx="7" fill="#1c2128" stroke="#c9d1d9" stroke-width="1.4"/>
  <text x="785" y="108" text-anchor="middle" fill="#ffffff" class="mono" font-size="11" font-weight="700">CORE &amp; RELAY</text>
  <text x="785" y="123" text-anchor="middle" fill="#8b949e" class="mono" font-size="9">APIs · Routing</text>

  <!-- Node 3: Data Layer -->
  <rect x="874" y="64" width="88" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="918" y="81" text-anchor="middle" fill="#ffffff" class="mono" font-size="10.5" font-weight="600">STORAGE</text>
  <text x="918" y="94" text-anchor="middle" fill="#8b949e" class="mono" font-size="8.5">SQL · Cache</text>

  <!-- Node 4: Infra Layer -->
  <rect x="874" y="122" width="88" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="918" y="139" text-anchor="middle" fill="#ffffff" class="mono" font-size="10.5" font-weight="600">RUNTIME</text>
  <text x="918" y="152" text-anchor="middle" fill="#8b949e" class="mono" font-size="8.5">Containers</text>

  <!-- Sub-Panel Footer Telemetry -->
  <line x1="594" y1="174" x2="962" y2="174" stroke="#21262d" stroke-width="1"/>
  <text x="594" y="189" fill="#6e7681" class="mono" font-size="9.5">MODE: PRAGMATIC</text>
  <text x="777" y="189" text-anchor="middle" fill="#6e7681" class="mono" font-size="9.5">SCALE: MODULAR</text>
  <text x="962" y="189" text-anchor="end" fill="#8b949e" class="mono" font-size="9.5">STATUS: ONLINE</text>
</svg>
