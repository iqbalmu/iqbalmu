<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 246" width="100%" role="img" aria-label="About Me and What I Work On">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- ================= LEFT BENTO TILE: ABOUT ME ================= -->
  <rect x="1" y="1" width="491" height="244" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header -->
  <text x="26" y="34" fill="#ffffff" class="mono" font-size="12.5" font-weight="700" letter-spacing="0.8">01 // ABOUT ME</text>
  <rect x="396" y="18" width="70" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="431" y="33" text-anchor="middle" fill="#8b949e" class="mono" font-size="10" font-weight="600">PROFILE</text>
  <line x1="26" y1="48" x2="466" y2="48" stroke="#21262d" stroke-width="1"/>

  <!-- Bio Text -->
  <text x="26" y="74" fill="#c9d1d9" class="sans" font-size="13">I enjoy understanding how software fits together end-to-end — from</text>
  <text x="26" y="94" fill="#c9d1d9" class="sans" font-size="13">the interfaces people use daily to the backend services, databases,</text>
  <text x="26" y="114" fill="#c9d1d9" class="sans" font-size="13">and small systems utilities running quietly underneath.</text>

  <!-- Spec Rows (Filling bottom half with zero empty space) -->
  <!-- Row 1 -->
  <rect x="26" y="130" width="440" height="30" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="38" y="149" fill="#ffffff" class="mono" font-size="10.5" font-weight="700">FOCUS</text>
  <text x="112" y="149" fill="#8b949e" class="sans" font-size="12">System design, scalable architecture &amp; clean boundaries</text>

  <!-- Row 2 -->
  <rect x="26" y="166" width="440" height="30" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="38" y="185" fill="#ffffff" class="mono" font-size="10.5" font-weight="700">WORK</text>
  <text x="112" y="185" fill="#8b949e" class="sans" font-size="12">Production web apps, APIs, CLI tools &amp; lightweight relays</text>

  <!-- Row 3 -->
  <rect x="26" y="202" width="440" height="30" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="38" y="221" fill="#ffffff" class="mono" font-size="10.5" font-weight="700">DIRECT</text>
  <text x="112" y="221" fill="#c9d1d9" class="mono" font-size="11.5">iqbalmu160@gmail.com</text>

  <!-- ================= RIGHT BENTO TILE: WHAT I WORK ON ================= -->
  <rect x="508" y="1" width="491" height="244" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header -->
  <text x="534" y="34" fill="#ffffff" class="mono" font-size="12.5" font-weight="700" letter-spacing="0.8">02 // WHAT I WORK ON</text>
  <rect x="892" y="18" width="82" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="933" y="33" text-anchor="middle" fill="#8b949e" class="mono" font-size="10" font-weight="600">4 DOMAINS</text>
  <line x1="534" y1="48" x2="974" y2="48" stroke="#21262d" stroke-width="1"/>

  <!-- 2x2 Inner Bento Grid -->
  <!-- Card 1: Top-Left -->
  <rect x="534" y="62" width="214" height="80" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1.2"/>
  <text x="548" y="84" fill="#ffffff" class="mono" font-size="11.5" font-weight="700">[01] Web &amp; Backend</text>
  <text x="548" y="105" fill="#8b949e" class="sans" font-size="11.5">Shipping full-stack web apps,</text>
  <text x="548" y="122" fill="#8b949e" class="sans" font-size="11.5">APIs, and core services.</text>

  <!-- Card 2: Top-Right -->
  <rect x="760" y="62" width="214" height="80" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1.2"/>
  <text x="774" y="84" fill="#ffffff" class="mono" font-size="11.5" font-weight="700">[02] CLI &amp; Tooling</text>
  <text x="774" y="105" fill="#8b949e" class="sans" font-size="11.5">Building CLI database managers</text>
  <text x="774" y="122" fill="#8b949e" class="sans" font-size="11.5">and workflow utilities.</text>

  <!-- Card 3: Bottom-Left -->
  <rect x="534" y="152" width="214" height="80" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1.2"/>
  <text x="548" y="174" fill="#ffffff" class="mono" font-size="11.5" font-weight="700">[03] Systems &amp; Relays</text>
  <text x="548" y="195" fill="#8b949e" class="sans" font-size="11.5">Tinkering with lightweight</text>
  <text x="548" y="212" fill="#8b949e" class="sans" font-size="11.5">relays and low-level protocols.</text>

  <!-- Card 4: Bottom-Right -->
  <rect x="760" y="152" width="214" height="80" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1.2"/>
  <text x="774" y="174" fill="#ffffff" class="mono" font-size="11.5" font-weight="700">[04] System Design</text>
  <text x="774" y="195" fill="#8b949e" class="sans" font-size="11.5">Structuring scalable data flows</text>
  <text x="774" y="212" fill="#8b949e" class="sans" font-size="11.5">and maintainable patterns.</text>
</svg>
