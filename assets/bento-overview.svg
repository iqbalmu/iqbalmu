<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 246" width="100%" role="img" aria-label="About Me and Core Capabilities">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- ================= LEFT BENTO TILE: ABOUT ME ================= -->
  <rect x="1" y="1" width="491" height="244" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header -->
  <text x="26" y="34" fill="#ffffff" class="mono" font-size="12.5" font-weight="700" letter-spacing="0.8">01 // ABOUT ME</text>
  <rect x="386" y="18" width="80" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="426" y="33" text-anchor="middle" fill="#8b949e" class="mono" font-size="10" font-weight="600">OVERVIEW</text>
  <line x1="26" y1="48" x2="466" y2="48" stroke="#21262d" stroke-width="1"/>

  <!-- Bio Text (General & Project-Agnostic) -->
  <text x="26" y="74" fill="#c9d1d9" class="sans" font-size="13">I enjoy understanding how software works across the entire stack —</text>
  <text x="26" y="94" fill="#c9d1d9" class="sans" font-size="13">from the interfaces people interact with every day to the backend</text>
  <text x="26" y="114" fill="#c9d1d9" class="sans" font-size="13">services, data models, and infrastructure running underneath.</text>

  <!-- Approach Rows (Zero overlap with Hero Spec) -->
  <!-- Row 1 -->
  <rect x="26" y="130" width="440" height="30" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="38" y="149" fill="#ffffff" class="mono" font-size="10" font-weight="700">END-TO-END</text>
  <text x="128" y="149" fill="#8b949e" class="sans" font-size="12">Bridging frontend experience with solid backend engineering</text>

  <!-- Row 2 -->
  <rect x="26" y="166" width="440" height="30" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="38" y="185" fill="#ffffff" class="mono" font-size="10" font-weight="700">DESIGN</text>
  <text x="128" y="185" fill="#8b949e" class="sans" font-size="12">Applying clean patterns so systems stay healthy as they scale</text>

  <!-- Row 3 -->
  <rect x="26" y="202" width="440" height="30" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="38" y="221" fill="#ffffff" class="mono" font-size="10" font-weight="700">CURIOSITY</text>
  <text x="128" y="221" fill="#8b949e" class="sans" font-size="12">Always exploring new languages, tools, and system internals</text>

  <!-- ================= RIGHT BENTO TILE: CORE CAPABILITIES ================= -->
  <rect x="508" y="1" width="491" height="244" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header -->
  <text x="534" y="34" fill="#ffffff" class="mono" font-size="12.5" font-weight="700" letter-spacing="0.8">02 // CORE CAPABILITIES</text>
  <rect x="892" y="18" width="82" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="933" y="33" text-anchor="middle" fill="#8b949e" class="mono" font-size="10" font-weight="600">4 PILLARS</text>
  <line x1="534" y1="48" x2="974" y2="48" stroke="#21262d" stroke-width="1"/>

  <!-- 2x2 Inner Bento Grid -->
  <!-- Card 1: Top-Left -->
  <rect x="534" y="62" width="214" height="80" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1.2"/>
  <text x="548" y="84" fill="#ffffff" class="mono" font-size="11.5" font-weight="700">[01] Frontend &amp; Web</text>
  <text x="548" y="105" fill="#8b949e" class="sans" font-size="11.5">Building responsive interfaces</text>
  <text x="548" y="122" fill="#8b949e" class="sans" font-size="11.5">and modern web applications.</text>

  <!-- Card 2: Top-Right -->
  <rect x="760" y="62" width="214" height="80" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1.2"/>
  <text x="774" y="84" fill="#ffffff" class="mono" font-size="11.5" font-weight="700">[02] Backend &amp; APIs</text>
  <text x="774" y="105" fill="#8b949e" class="sans" font-size="11.5">Designing reliable services,</text>
  <text x="774" y="122" fill="#8b949e" class="sans" font-size="11.5">REST APIs, and business logic.</text>

  <!-- Card 3: Bottom-Left -->
  <rect x="534" y="152" width="214" height="80" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1.2"/>
  <text x="548" y="174" fill="#ffffff" class="mono" font-size="11.5" font-weight="700">[03] System Architecture</text>
  <text x="548" y="195" fill="#8b949e" class="sans" font-size="11.5">Structuring scalable data flows,</text>
  <text x="548" y="212" fill="#8b949e" class="sans" font-size="11.5">caching, and clean boundaries.</text>

  <!-- Card 4: Bottom-Right -->
  <rect x="760" y="152" width="214" height="80" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1.2"/>
  <text x="774" y="174" fill="#ffffff" class="mono" font-size="11.5" font-weight="700">[04] Tooling &amp; Infra</text>
  <text x="774" y="195" fill="#8b949e" class="sans" font-size="11.5">Developing CLI utilities, workflows,</text>
  <text x="774" y="212" fill="#8b949e" class="sans" font-size="11.5">and containerized environments.</text>
</svg>
